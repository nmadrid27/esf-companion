name: Test Install Scripts

on:
  push:
    paths:
      - 'install.sh'
      - 'setup-repo.sh'
      - '.github/workflows/test-install.yml'
      - '.claude/hooks/esf-update-check.sh'
      - 'test/test-update-check.sh'
      - 'scripts/release.sh'
      - 'scripts/release-drift.sh'
      - 'test/test-release-tooling.sh'
  pull_request:
    paths:
      - 'install.sh'
      - 'setup-repo.sh'
      - '.github/workflows/test-install.yml'
      - '.claude/hooks/esf-update-check.sh'
      - 'test/test-update-check.sh'
      - 'scripts/release.sh'
      - 'scripts/release-drift.sh'
      - 'test/test-release-tooling.sh'

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check bash syntax
        run: |
          bash -n install.sh
          bash -n setup-repo.sh

  test-claude-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test Claude Code install (force mode)
        # `--source $GITHUB_WORKSPACE` tells install.sh to fetch from the
        # checked-out PR rather than from the latest release tag on GitHub.
        # Without it, install.sh fetches every file via raw.githubusercontent
        # against the resolved tag, so any file the PR adds (e.g. MANIFEST.txt
        # in #22) 404s until merge — chicken-and-egg. With --source, the test
        # actually exercises the PR's complete install rather than the PR's
        # install.sh + main's other files.
        run: |
          mkdir -p /tmp/test-claude && cd /tmp/test-claude
          git init
          bash "$GITHUB_WORKSPACE/install.sh" --force --platform claude --source "$GITHUB_WORKSPACE"
          test -f .claude/agents/esf-companion.md || exit 1
          test -f esf/toolkit/prompts/companion.md || exit 1
          test -f esf/toolkit/prompts/esf-companion.md || exit 1
          test -f esf/toolkit/templates/position-statement.md || exit 1
          test -f esf/toolkit/templates/five-questions-checklist.md || exit 1
          test -f esf/toolkit/WORKFLOW.md || exit 1
          echo "Claude install: all expected files present"

  test-conversation-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test conversation install (force mode)
        run: |
          mkdir -p /tmp/test-conv && cd /tmp/test-conv
          git init
          bash "$GITHUB_WORKSPACE/install.sh" --force --platform conversation --source "$GITHUB_WORKSPACE"
          test -f esf/toolkit/prompts/companion.md || exit 1
          test -f esf/toolkit/prompts/esf-companion.md || exit 1
          test -f esf/toolkit/templates/position-statement.md || exit 1
          test -f esf/toolkit/templates/five-questions-checklist.md || exit 1
          test -f esf/toolkit/templates/disclosure-statement.md || exit 1
          test ! -d .claude || exit 1
          echo "Conversation install: correct files present, no .claude/"

  test-platform-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test invalid platform flag exits with error
        run: |
          mkdir -p /tmp/test-invalid && cd /tmp/test-invalid
          if bash "$GITHUB_WORKSPACE/install.sh" --force --platform typo --source "$GITHUB_WORKSPACE" 2>/dev/null; then
            echo "ERROR: should have exited non-zero"
            exit 1
          fi
          echo "Platform validation: correctly rejected invalid value"

  test-update-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint + run update-check shell tests
        run: |
          bash -n .claude/hooks/esf-update-check.sh
          bash test/test-update-check.sh

  test-release-tooling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Lint + run release-tooling shell tests
        run: |
          bash -n scripts/release-drift.sh scripts/release.sh
          bash test/test-release-tooling.sh
